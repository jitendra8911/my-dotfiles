# AeroSpace config — i3-style tiling WM for macOS
# Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Reload after editing:  Alt-Shift-C  (mapped below) or `aerospace reload-config`
# Mod key here is Alt (Option). Change `alt` -> `cmd` below if you prefer.

# Start AeroSpace at login (so you don't have to launch it manually).
start-at-login = true

# Normalizations keep the tree tidy so layouts stay predictable.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout for new windows in a workspace: binary space partitioning.
# Use 'tiles' for the classic i3 side-by-side splitting.
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto' # horizontal on wide screens, vertical on tall

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = 'move-mouse window-lazy-center'

# Gaps between windows and screen edges (feel free to zero these out).
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

# ---------------------------------------------------------------------------
# Auto-assign apps to numbered workspaces.
# Find an app's id with:  aerospace list-apps   (look at the App Bundle ID)
# ---------------------------------------------------------------------------
# WS 1 — Slack (lands on the laptop screen, see monitor assignment below)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'



# WS 2 — Terminal (lands on the far / third monitor)
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'move-node-to-workspace T'


# WS 3 — Browser (lands on the monitor adjacent to the laptop)
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace B'


# WS 4 — Database / API tools (far monitor)
[[on-window-detected]]
if.app-id = 'com.jetbrains.datagrip'
run = 'move-node-to-workspace D'


# WS 5 — Editors / IDE (adjacent monitor)
[[on-window-detected]]
if.app-id = 'com.jetbrains.WebStorm'
run = 'move-node-to-workspace T'


[[on-window-detected]]
if.app-id = 'com.sublimetext.4'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.postmanlabs.mac'
run = 'move-node-to-workspace T'

# ---------------------------------------------------------------------------
# Pin workspaces to a specific monitor on a three-display setup.
# Monitors are addressed by their left-to-right sequence number (see
# `aerospace list-monitors`):
#   1 = Built-in laptop display
#   2 = external monitor adjacent to the laptop
#   3 = far / third external monitor
# ---------------------------------------------------------------------------
[workspace-to-monitor-force-assignment]
S = 1  # Slack   -> laptop screen
T = 2  # terminal-> far monitor
B = 3  # browser -> adjacent monitor
D = 2  # datagrip -> adjacent monitor
M = 1  # db / api-> far monitor
P = 1  # db / api-> far monitor

# --------------------------------------------------------------------------- Keybindings (main mode)
# ---------------------------------------------------------------------------
[mode.main.binding]

# --- Switch to workspace by number (i3-style) ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-s = 'workspace S'
alt-t = 'workspace T'
alt-b = 'workspace B'
alt-d = 'workspace D'
alt-m = 'workspace M'
alt-p = 'workspace P'

# --- Move focused window to a workspace ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-p = 'move-node-to-workspace P'

# --- Quick toggle to the last-used workspace (like i3's `workspace back_and_forth`) ---
alt-tab = 'workspace-back-and-forth'

# --- Focus windows (Vim h/j/k/l) ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- Move windows within the layout ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Move whole workspace to the other monitor ---
alt-shift-comma = 'move-workspace-to-monitor --wrap-around next'

# --- Layout controls ---
alt-slash = 'layout tiles horizontal vertical' # toggle split orientation
alt-comma = 'layout accordion horizontal vertical' # accordion (stacked) layout
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling' # toggle floating for the focused window

# --- Resize the focused window ---
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# --- Reload config after edits ---
alt-shift-c = 'reload-config'

# --- Enter "service" mode for less-common actions ---
alt-shift-semicolon = 'mode service'

# ---------------------------------------------------------------------------
# Service mode: press Alt-Shift-;  then a key below, Esc/Enter to exit.
# ---------------------------------------------------------------------------
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset the layout tree
f = ['layout floating tiling', 'mode main'] # toggle floating
backspace = ['close-all-windows-but-current', 'mode main']

# Join the focused window with a neighbor (build a split container)
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
