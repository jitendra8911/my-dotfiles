# Hyprland config — i3/AeroSpace-inspired bindings, ported from the macOS
# AeroSpace config in config/aerospace/aerospace.toml.
#
# Reload after editing:  Alt + Shift + C   (or `hyprctl reload`)
# The mod key is Alt, matching the AeroSpace muscle memory. Change `$mainMod`
# to SUPER below if you prefer the usual Hyprland default.

$mainMod = ALT

$terminal = wezterm

monitor = , preferred, auto, auto

# --------------------------------------------------------------------------
# Cursor
# --------------------------------------------------------------------------
# Without an explicit theme, Hyprland falls back to its built-in cursor, which
# draws the odd "water drop" arrow. Adwaita is the normal arrow GNOME already
# uses. (Home Manager sets the same values session-wide; these `env =` lines
# make the compositor honour them no matter how the session was started.)
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

# --------------------------------------------------------------------------
# Look & feel (mirrors the AeroSpace 8px gaps)
# --------------------------------------------------------------------------
general {
    gaps_in     = 8
    gaps_out    = 8
    border_size = 2
    col.active_border   = rgb(89b4fa)
    col.inactive_border = rgb(45475a)
    layout = dwindle
}

decoration {
    rounding = 8
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# --------------------------------------------------------------------------
# Applications
# --------------------------------------------------------------------------
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space,  exec, fuzzel

# --------------------------------------------------------------------------
# Workspaces: numbers 1-6 plus the named app workspaces from AeroSpace
# (S = Slack, T = Terminal, B = Browser, D = DataGrip, M/P = misc)
# --------------------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, S, workspace, name:S
bind = $mainMod, T, workspace, name:T
bind = $mainMod, B, workspace, name:B
bind = $mainMod, D, workspace, name:D
bind = $mainMod, M, workspace, name:M
bind = $mainMod, P, workspace, name:P

# Move the focused window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, S, movetoworkspace, name:S
bind = $mainMod SHIFT, T, movetoworkspace, name:T
bind = $mainMod SHIFT, B, movetoworkspace, name:B
bind = $mainMod SHIFT, D, movetoworkspace, name:D
bind = $mainMod SHIFT, M, movetoworkspace, name:M
bind = $mainMod SHIFT, P, movetoworkspace, name:P

# Back-and-forth to the previous workspace (i3 `workspace back_and_forth`)
bind = $mainMod, Tab, workspace, previous

# --------------------------------------------------------------------------
# Focus / move windows (vim h/j/k/l)
# --------------------------------------------------------------------------
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Send the focused workspace to the next monitor
bind = $mainMod SHIFT, comma, movecurrentworkspacetomonitor, +1

# --------------------------------------------------------------------------
# Layout controls
# --------------------------------------------------------------------------
bind = $mainMod, slash,       layoutmsg, togglesplit
bind = $mainMod, F,           fullscreen, 0
bind = $mainMod SHIFT, Space, togglefloating
bind = $mainMod, Q,           killactive

# Resize the focused window
bind = $mainMod, minus, resizeactive, -50 0
bind = $mainMod, equal, resizeactive, 50 0

# --------------------------------------------------------------------------
# Media / screenshots / session
# --------------------------------------------------------------------------
bind = $mainMod, V, exec, wl-paste --type text --paste-once

# Screenshots (grim + slurp). Clipboard-only by default; Shift/Alt also save a
# timestamped PNG to ~/Pictures/Screenshots — the same folder GNOME's screenshot
# tool uses, so both desktops put files in one place.
bind = ,             Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT,        Print, exec, mkdir -p "$HOME/Pictures/Screenshots" && grim -g "$(slurp)" "$HOME/Pictures/Screenshots/region-$(date +%F-%H%M%S).png"
bind = $mainMod,     Print, exec, mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/full-$(date +%F-%H%M%S).png"

bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, Q, exec, hyprctl dispatch exit
