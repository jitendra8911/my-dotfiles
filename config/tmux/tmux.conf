# Truecolor (24-bit) so the Catppuccin palette renders exactly, not quantized to 256
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"
set -ag terminal-features ",*:RGB"

# Clipboard: let applications (e.g. Claude CLI) set the system clipboard via OSC 52,
# and forward those sequences through to iTerm2 instead of printing them as text.
set -g set-clipboard on
set -g allow-passthrough on

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# Mouse: off so click-drag does native iTerm2 text selection everywhere.
# Trade-off: with mouse off, tmux no longer scopes selection to the focused
# pane/popup, so drag-select can bleed through the Claude sidekick popup into
# neovim behind it. Toggle back on with `prefix + m` if that becomes a problem.
set -g mouse off
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Catppuccin theme (Mocha) — must be set before TPM loads the plugin below
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_default_fill 'number'
set -g @catppuccin_window_current_fill 'number'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Start window numbering at 1
set -g base-index 1
set -g renumber-windows on

# Start pane numbering at 1
setw -g pane-base-index 1

# Catppuccin status line (must run AFTER `run tpm` so the @catppuccin_* modules exist)
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'

# tmux-sessionizer: prefix + f to fuzzy-find and switch to a project session
bind-key -r f run-shell "tmux neww tmux-sessionizer"

# New windows/splits open in the session's @root (set by tmux-sessionizer),
# falling back to the current pane's path if @root isn't set.
bind c new-window -c "#{?@root,#{@root},#{pane_current_path}}"
bind '"' split-window -v -c "#{?@root,#{@root},#{pane_current_path}}"
bind % split-window -h -c "#{?@root,#{@root},#{pane_current_path}}"
